<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumix Handshake Test</title>
<style>
  body { font-family: sans-serif; margin: 12px; }
  label, input { font-size: 16px; }
  input[type=text] { width: 9em; padding: 4px; }
  button { font-size: 16px; padding: 12px; margin: 4px 4px 4px 0; }
  #url { font-family: monospace; font-size: 12px; word-break: break-all; color: #555; margin: 8px 0; }
  iframe { width: 100%; height: 200px; border: 1px solid #888; background: #fff; }
  h2 { margin: 16px 0 4px; font-size: 16px; }
</style>
</head>
<body>
<h1 style="font-size:20px">Lumix Handshake Test</h1>

<p>
  <label>Camera IP: <input type="text" id="ip" value="192.168.54.1"></label>
</p>

<h2>1. Handshake</h2>
<button onclick="send('mode=accctrl&type=req_acc&value=4D454930-0100-1000-8001-020A0005A9CF&value2=DC9602%20Reader')">Handshake 1</button>
<button onclick="send('mode=accctrl&type=req_acc&value=4D454930-0100-1000-8001-02FA000430C6&value2=MI%205')">Handshake 2</button>
<button onclick="send('mode=accctrl&type=req_acc&value=4D454930-0100-1000-8000-F02765BACACE&value2=DMC-CM1')">Handshake 3</button>

<h2>2. Start session</h2>
<button onclick="send('mode=camcmd&value=recmode')">Connect (Start OTA)</button>

<h2>3. Check</h2>
<button onclick="send('mode=getstate')">Get State</button>
<button onclick="send('mode=getinfo&type=capability')">Get Capability</button>

<div id="url">Last request: (none)</div>
<iframe name="out" id="out"></iframe>

<script>
function send(query) {
  var ip = document.getElementById('ip').value.trim();
  var url = 'http://' + ip + '/cam.cgi?' + query;
  document.getElementById('url').textContent = 'Last request: ' + url;
  document.getElementById('out').src = url;  // loads inside the iframe, no new tab
}
</script>
</body>
</html>
